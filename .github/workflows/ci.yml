name: CI and release

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Prepare archive directories and daily package snapshot
        id: prep
        run: |
          mkdir -p .ci-artifacts/ci .ci-artifacts/runtime .ci-artifacts/scan
          echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: Build images once
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          files: docker-bake.hcl
          provenance: false
          vars: |
            APK_REFRESH=${{ steps.prep.outputs.day }}
          set: |
            ci.cache-from=type=gha,scope=ci
            ci.cache-to=type=gha,scope=ci,mode=max
            ci.output=type=docker,dest=.ci-artifacts/ci/image.tar
            runtime.cache-from=type=gha,scope=runtime
            runtime.cache-to=type=gha,scope=runtime,mode=max
            runtime.output=type=docker,dest=.ci-artifacts/runtime/image.tar
            scan.cache-from=type=gha,scope=scan
            scan.cache-to=type=gha,scope=scan,mode=max
            scan.output=type=docker,dest=.ci-artifacts/scan/image.tar
      - name: Checksum image archives
        run: |
          for image in ci runtime scan; do
            (cd ".ci-artifacts/$image" && sha256sum image.tar > SHA256SUMS)
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-ci
          path: .ci-artifacts/ci/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-runtime
          path: .ci-artifacts/runtime/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-scan
          path: .ci-artifacts/scan/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  pytest:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: image-ci
          path: .ci-artifacts/ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: image-runtime
          path: .ci-artifacts/runtime
      - name: Verify and load CI image
        run: |
          (cd .ci-artifacts/ci && sha256sum --check SHA256SUMS)
          docker load -i .ci-artifacts/ci/image.tar
      - name: pytest
        run: docker run downloader-ci:checked pytest -q -o tmp_path_retention_policy=all
      - name: Installed runtime import smoke test
        run: |
          (cd .ci-artifacts/runtime && sha256sum --check SHA256SUMS)
          docker load -i .ci-artifacts/runtime/image.tar
          docker run -e TELEGRAM_BOT_TOKEN=test-token downloader-runtime:checked python -c 'import tg_downloader, bot; import importlib.metadata; print(importlib.metadata.version("selfhost-tg-downloader"))'
          docker run downloader-runtime:checked python -c 'import subprocess; p="/app/downloads/ci-smoke.mp4"; subprocess.run(["ffmpeg","-v","error","-f","lavfi","-i","color=c=black:s=16x16:d=0.1","-c:v","mpeg4",p],check=True); result=subprocess.check_output(["ffprobe","-v","error","-show_entries","stream=codec_type","-of","csv=p=0",p],text=True).strip(); assert result=="video",result; print("FFmpeg offline encode/probe: PASS")'

  mypy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: image-ci
          path: .ci-artifacts/ci
      - name: Verify and load CI image
        run: |
          (cd .ci-artifacts/ci && sha256sum --check SHA256SUMS)
          docker load -i .ci-artifacts/ci/image.tar
      - name: mypy
        run: docker run downloader-ci:checked mypy src tests scripts

  ruff:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: image-ci
          path: .ci-artifacts/ci
      - name: Verify and load CI image
        run: |
          (cd .ci-artifacts/ci && sha256sum --check SHA256SUMS)
          docker load -i .ci-artifacts/ci/image.tar
      - name: ruff
        run: docker run downloader-ci:checked sh -ec "ruff check src tests scripts && ruff format --check src tests scripts"

  flake8:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: image-ci
          path: .ci-artifacts/ci
      - name: Verify and load CI image
        run: |
          (cd .ci-artifacts/ci && sha256sum --check SHA256SUMS)
          docker load -i .ci-artifacts/ci/image.tar
      - name: flake8 (wemake-python-styleguide)
        run: docker run downloader-ci:checked flake8 src tests scripts

  ty:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: image-ci
          path: .ci-artifacts/ci
      - name: Verify and load CI image
        run: |
          (cd .ci-artifacts/ci && sha256sum --check SHA256SUMS)
          docker load -i .ci-artifacts/ci/image.tar
      - name: ty
        run: docker run downloader-ci:checked ty check src tests

  bandit:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: image-ci
          path: .ci-artifacts/ci
      - name: Verify and load CI image
        run: |
          (cd .ci-artifacts/ci && sha256sum --check SHA256SUMS)
          docker load -i .ci-artifacts/ci/image.tar
      - name: bandit
        run: docker run downloader-ci:checked bandit -r src

  gitleaks:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: image-scan
          path: .ci-artifacts/scan
      - name: Scan complete git history
        run: |
          (cd .ci-artifacts/scan && sha256sum --check SHA256SUMS)
          docker load -i .ci-artifacts/scan/image.tar
          docker run -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo -v "$PWD:/repo:ro" downloader-scan:checked gitleaks git /repo --log-opts="--all" --redact --verbose

  trivy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: image-scan
          path: .ci-artifacts/scan
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: image-runtime
          path: .ci-artifacts/runtime
      - name: Scan actual runtime image (including unfixed vulnerabilities)
        run: |
          (cd .ci-artifacts/runtime && sha256sum --check SHA256SUMS)
          (cd .ci-artifacts/scan && sha256sum --check SHA256SUMS)
          docker load -i .ci-artifacts/scan/image.tar
          docker run -v "$PWD/.ci-artifacts/runtime:/images:ro" downloader-scan:checked trivy image --input /images/image.tar --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --timeout 10m

  release-eligibility:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, pytest, mypy, ruff, flake8, ty, bandit, gitleaks, trivy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      merged: ${{ steps.pr.outputs.merged }}
    steps:
      - name: Verify exact main SHA belongs to a merged PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq ".[] | select(.merged_at != null and .base.ref == \"main\" and .merge_commit_sha == \"$GITHUB_SHA\") | .number" > merged-prs.txt
          if test -s merged-prs.txt; then
            echo "merged=true" >> "$GITHUB_OUTPUT"
          else
            echo "No merged PR for this exact main SHA; publication is skipped."
            echo "merged=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.release-eligibility.outputs.merged == 'true'
    needs: [build, pytest, mypy, ruff, flake8, ty, bandit, gitleaks, trivy, release-eligibility]
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Resolve version and skip existing releases
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(python -c 'import re,tomllib; v=tomllib.load(open("pyproject.toml","rb"))["project"]["version"]; assert re.fullmatch(r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)",v), "Expected X.Y.Z version"; print("v"+v)')
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[].tag_name' > published-tags.txt
          if grep -Fxq "$tag" published-tags.txt; then
            echo "Version $tag already has a release; skipping publication."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            # Refuse to reuse an unrelated tag; the release command creates a new one at this checked SHA.
            existing=$(git ls-remote --tags origin "refs/tags/$tag")
            test -z "$existing" || { echo "Tag $tag already exists without a release; resolve it manually."; exit 1; }
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: steps.version.outputs.publish == 'true'
        with:
          name: image-runtime
          path: .ci-artifacts/runtime
      - name: Verify checked runtime version
        if: steps.version.outputs.publish == 'true'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          (cd .ci-artifacts/runtime && sha256sum --check SHA256SUMS)
          docker load -i .ci-artifacts/runtime/image.tar
          version=$(docker run downloader-runtime:checked python -c 'import importlib.metadata; print(importlib.metadata.version("selfhost-tg-downloader"))')
          test "$RELEASE_TAG" = "v$version"
      - name: Publish the same runtime image and release checked main SHA
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:$RELEASE_TAG"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          if docker manifest inspect "$image" > image-manifest.json 2> registry-status.txt; then
            docker pull "$image"
            test "$(docker image inspect "$image" --format '{{.Id}}')" = "$(docker image inspect downloader-runtime:checked --format '{{.Id}}')" || { echo "Existing version image differs; refusing to overwrite it."; exit 1; }
            echo "Identical checked image already published; completing only missing release steps."
          elif grep -Eq 'manifest unknown|no such manifest|name unknown' registry-status.txt; then
            docker tag downloader-runtime:checked "$image"
            docker push "$image"
          else
            cat registry-status.txt
            exit 1
          fi
          docker pull "$image"
          test "$(docker image inspect "$image" --format '{{.Id}}')" = "$(docker image inspect downloader-runtime:checked --format '{{.Id}}')"
          docker image inspect "$image" --format '{{index .RepoDigests 0}}' > image-digest.txt
          gh release create "$RELEASE_TAG" image-digest.txt --target "$GITHUB_SHA" --title "$RELEASE_TAG" --generate-notes
          gh release view "$RELEASE_TAG" --json url,tagName,targetCommitish,assets
