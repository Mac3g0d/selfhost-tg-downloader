services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: tg-downloader-bot
    restart: unless-stopped
    command: ["bot"]
    env_file:
      - .env
    environment:
      - DOWNLOAD_DIR=/app/downloads
      - COOKIES_FILE=/app/cookies/instagram.txt
    volumes:
      - downloads:/app/downloads
      - database:/app/data
      - ./cookies:/app/cookies:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  database:
    driver: local
  downloads:
    driver: local
