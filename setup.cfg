[flake8]
# wemake-python-styleguide only; formatting and the other checks stay with ruff.
select = WPS
max-line-length = 99
extend-exclude = .venv
per-file-ignores =
    # pydantic-settings maps upper-case field names onto environment variables.
    src/config.py: WPS115
    # Tests: literal fixtures, long descriptive names, helper closures, many cases per module.
    tests/*: WPS118, WPS201, WPS202, WPS204, WPS218, WPS226, WPS430, WPS432
