[project]
name = "selfhost-tg-downloader"
version = "1.0.0"
description = "Telegram bot for downloading TikTok & Instagram videos via gallery-dl"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.14"
dependencies = [
    "aiogram>=3.20,<4.0",
    "aiosqlite>=0.22.1",
    "gallery-dl>=1.29",
    "pydantic-settings>=2.9",
    "structlog>=25.1",
]

[project.scripts]
bot = "tg_downloader:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.26",
    "pytest-mock>=3.14",
    "mypy>=1.15",
    "ruff>=0.11",
    "ty>=0.0.104",
    "bandit>=1.9.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = [
    "src/tg_downloader.py", "src/bot.py", "src/config.py",
    "src/database.py", "src/healthcheck.py", "src/inflight.py", "src/timing.py", "src/utils.py",
    "src/downloader", "src/handlers",
]
dev-mode-dirs = ["src"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.ruff]
target-version = "py314"
line-length = 99
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A",
    "S", "T20", "SIM", "RUF", "ASYNC",
]
ignore = [
    "S603", "S607", "S108",
    "RUF001", "ASYNC240",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S110"]

[tool.ruff.lint.isort]
known-first-party = ["bot", "config", "database", "downloader", "handlers", "healthcheck", "inflight", "tg_downloader", "timing", "utils"]

[tool.mypy]
python_version = "3.14"
mypy_path = "src"
explicit_package_bases = true
exclude = ['^src/__init__\.py$']
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["structlog.*", "gallery_dl.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error"]
